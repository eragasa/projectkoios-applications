[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "projectkoios_build"
backend-path = ["build_backend"]

[project]
name = "projectkoios-applications"
version = "0.1.0.dev0"
description = "Workflow- and CPN-enabled application composition for Project Koios"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]
dependencies = []

[project.urls]
Repository = "https://github.com/eragasa/projectkoios-applications"
Documentation = "https://github.com/eragasa/projectkoios-applications/tree/main/docs"

[project.scripts]
koios-pdf-corpus-ingestion = "projectkoios.applications.pdf_corpus_ingestion.cli:main"

[project.optional-dependencies]
pdf-corpus = [
    "projectkoios-ingestion[pdf]==0.0.0",
    "projectkoios-references==0.0.0",
]
simulations = [
    "projectkoios-simulations>=0.1.0.dev0,<0.2",
]
examples = [
    "projectkoios-simulations>=0.1.0.dev0,<0.2",
    "numpy>=2.3,<3",
    "physkit>=0.1,<0.2",
    "plotly>=6.5,<7",
    "SNAKES==0.9.33",
]
development = [
    "build>=1.3,<2",
    "projectkoios-simulations>=0.1.0.dev0,<0.2",
    "mypy>=2.3,<3",
    "numpy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
    "setuptools==84.0.0",
    "SNAKES==0.9.33",
]

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["projectkoios.applications*"]
namespaces = true

[tool.setuptools.package-data]
"projectkoios.applications" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "adversarial: malformed, unauthorized, or boundary-hostile cases",
    "integration: interaction between multiple committed component contracts",
    "property: deterministic bounded property cases",
    "smoke: quick check that a non-calculator entry point performs its basic operation",
    "validation: opt-in numerical or scientific validation",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["projectkoios", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = ["build_backend", "src/python/projectkoios/applications", "tests"]
mypy_path = "src/python"
